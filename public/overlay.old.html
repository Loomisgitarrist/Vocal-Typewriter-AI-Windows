<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recording Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      background: transparent;
      overflow: hidden;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .overlay-container {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 18px;
      height: 100%;
      width: 100%;
      color: white;
      transition: opacity 0.2s ease;
      /* Border to match system style slightly */
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .icon-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      width: 24px;
    }

    /* Bars Container */
    .bars-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 24px;
    }

    .bar {
      width: 4px;
      background: #ff4d4d; /* Reddish color */
      border-radius: 2px;
      min-height: 4px;
      transition: height 0.05s ease-out;
    }

    .status-text {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.9;
      margin-left: 8px;
    }
    
    /* Icons */
    .mic-icon {
      width: 16px;
      height: 16px;
      fill: #ff4d4d;
    }
    
    .transcribe-icon {
      width: 16px;
      height: 16px;
      fill: #4d94ff;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="overlay-container">
    <div class="icon-container" id="icon-container">
      <!-- Mic Icon SVG -->
      <svg class="mic-icon" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
    
    <div class="bars-container" id="bars-container">
      <!-- Bars generated by JS -->
    </div>
    
    <div id="transcribing-state" class="hidden" style="display: flex; align-items: center;">
      <span class="status-text">Transcribing...</span>
    </div>
  </div>
  
  <script>
    const barsContainer = document.getElementById('bars-container');
    const transcribingState = document.getElementById('transcribing-state');
    const iconContainer = document.getElementById('icon-container');
    
    // Create bars
    const BAR_COUNT = 12;
    const bars = [];
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = '4px';
      barsContainer.appendChild(bar);
      bars.push(bar);
    }
    
    // Access Tauri APIs
    const { listen } = window.__TAURI__.event;
    
    // Handle mic levels
    listen('mic-level', (event) => {
        // Event payload is [rms] from audio.rs
        // or [val1, val2...] if we update audio.rs
        // Currently it is [rms * 100.0]
        
        let levels = event.payload;
        let volume = 0;
        
        if (Array.isArray(levels) && levels.length > 0) {
            volume = levels[0]; // Simple RMS
        }
        
        // Update bars based on single volume value to create a "wave" effect
        bars.forEach((bar, i) => {
            // Create a symmetrical wave shape
            // Center bars are taller
            const distanceFromCenter = Math.abs(i - (BAR_COUNT / 2));
            const centerFactor = 1 - (distanceFromCenter / (BAR_COUNT / 2));
            
            // Randomize slightly for "voice" look
            const random = 0.8 + Math.random() * 0.4;
            
            // Calculate height
            let h = 4 + (volume * 1.5 * centerFactor * random);
            h = Math.min(Math.max(h, 4), 22); // Clamp
            
            bar.style.height = `${h}px`;
            
            // Opacity based on volume
            bar.style.opacity = Math.min(0.4 + (volume * 0.02), 1);
        });
    });
    
    // Handle state changes
    listen('start-recording', () => {
        document.body.style.opacity = '1';
        barsContainer.classList.remove('hidden');
        transcribingState.classList.add('hidden');
        iconContainer.innerHTML = `
          <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        `;
        // Reset bars
        bars.forEach(b => b.style.height = '4px');
    });
    
    listen('stop-recording', () => {
        // Switch to transcribing view
        barsContainer.classList.add('hidden');
        transcribingState.classList.remove('hidden');
        iconContainer.innerHTML = `
          <svg class="transcribe-icon" viewBox="0 0 24 24">
            <path d="M12 4V2.21c0-.45-.54-.67-.85-.35l-2.8 2.79c-.2.2-.2.51 0 .71l2.79 2.79c.31.31.85.09.85-.35V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v1.79c0 .45.54.67.85.35l2.8-2.79c.2-.2.2-.51 0-.71l-2.79-2.79c-.31-.31-.85-.09-.85.35V18z"/>
          </svg>
        `;
    });
    
    listen('hide-overlay', () => {
        document.body.style.opacity = '0';
    });

  </script>
</body>
</html>
