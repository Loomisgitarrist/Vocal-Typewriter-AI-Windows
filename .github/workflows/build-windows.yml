name: Build Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        # Pinned: Rust >= 1.100 changed cargo's build-dir layout, which breaks
        # ort-sys 2.0.0-rc.10's copy-dylibs (it walks a fixed number of parents
        # to find target/<triple>/release and panics with "path not specified").
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build frontend
        run: bun run build
      
      - name: Build Windows ${{ matrix.arch }}
        continue-on-error: ${{ matrix.arch == 'arm64' }}
        run: bun tauri build --target ${{ matrix.target }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-installer
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
