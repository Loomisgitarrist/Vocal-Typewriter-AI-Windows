[package]
name = "vocal-typewriter"
version = "1.0.0"
description = "Vocal Typewriter"
authors = ["Your Name"]
edition = "2021"
license = "MIT"

[lib]
name = "vocal_typewriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-macos-permissions = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16"
anyhow = "1"
hound = "3.5"
log = "0.4"
tokio = { version = "1", features = ["full"] }
enigo = "0.6"
ort = { version = "2.0.0-rc.10", features = ["download-binaries"] }
ndarray = "0.16"
rubato = "0.16"
once_cell = "1"
# Model download dependencies
reqwest = { version = "0.11", features = ["stream", "json", "blocking"] }
futures-util = "0.3"
flate2 = "1.0"
tar = "0.4"
rodio = "0.19"
transcribe-rs = { git = "https://github.com/cjpais/transcribe-rs", features = ["parakeet"] }
raw-window-handle = "0.6"
screenshots = "0.8.10"
base64 = "0.22.1"
image = "0.25.9"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13", features = ["coreml"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
cocoa = "0.26"
objc = "0.2"

# whisper-rs requires C++ compilation which fails on GitHub Actions Windows runners
# Since this app primarily uses Parakeet, we exclude whisper on Windows
[target.'cfg(not(target_os = "macos"))'.dependencies]
# whisper-rs = { version = "0.13" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
